name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: notes-api-ec2-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      AWS_REGION: us-east-1
      ECR_REGISTRY: 726862573245.dkr.ecr.us-east-1.amazonaws.com
      ECR_REPOSITORY: notes-api-ec2
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_IN_AUTOMATION: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Run tests
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pytest -q

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.17.1'

      - name: Login to ECR
        run: |
          aws ecr get-login-password |
            docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build and publish image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$TAG"

          docker build -t "$IMAGE" .
          docker push "$IMAGE"

          DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          echo "uri=$ECR_REGISTRY/$ECR_REPOSITORY@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Initialize Terraform
        run: terraform -chdir=terraform init -input=false -lockfile=readonly

      - name: Check Terraform
        run: |
          terraform -chdir=terraform fmt -check -recursive
          terraform -chdir=terraform validate

      - name: Plan deployment
        env:
          TF_VAR_image_uri: ${{ steps.image.outputs.uri }}
        run: terraform -chdir=terraform plan -input=false -out=deployment.tfplan

      - name: Apply deployment
        run: terraform -chdir=terraform apply -input=false deployment.tfplan

      - name: Wait for instance refresh
        shell: bash
        run: |
          set -euo pipefail
          REFRESH_ID=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name notes-api-ec2 \
            --query 'InstanceRefreshes[0].InstanceRefreshId' \
            --output text)

          test "$REFRESH_ID" != "None"

          for attempt in $(seq 1 90); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name notes-api-ec2 \
              --instance-refresh-ids "$REFRESH_ID" \
              --query 'InstanceRefreshes[0].Status' \
              --output text)

            echo "Instance refresh: $STATUS"

            case "$STATUS" in
              Successful) exit 0 ;;
              Failed|Cancelled|RollbackFailed|RollbackSuccessful)
                exit 1
                ;;
            esac

            sleep 20
          done

          echo "Timeout waiting for instance refresh"
          exit 1

      - name: Verify HTTPS
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 10 --max-time 20 \
            https://notes.gabriele-giancane.com/health

      - name: Record deployed image
        if: success()
        env:
          DEPLOYED_IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("release.auto.tfvars.json").write_text(
              json.dumps({"image_uri": os.environ["DEPLOYED_IMAGE"]})
          )
          PY

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: deployed-release
          path: release.auto.tfvars.json
          retention-days: 30
