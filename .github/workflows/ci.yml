name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.lock

      - name: Run tests
        run: python -m pytest -q

      - name: Build Docker image
        run: docker build -t notes-api-ec2:${{ github.sha }} .
